name: Python tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-benchmark.txt
      - run: python public_benchmark.py
      - run: python neural_train.py
      - run: python build_demo_data.py
      - run: python -m unittest discover -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test_demo.cjs

      - name: Run twenty practical exercises
        run: python validate_scenarios.py

      - name: Check enhanced browser behavior
        run: node test_enhanced.cjs
      - name: Reproduce case study
        run: python benchmark.py


      - run: node test_neural.cjs

      - name: Upload reproducible experiment evidence
        uses: actions/upload-artifact@v4
        with:
          name: experiment-evidence-${{ matrix.python }}
          path: |
            artifacts/*.json
          retention-days: 30
