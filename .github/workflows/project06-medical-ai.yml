name: project06-medical-ai
on:
  push:
    branches: [project-06-alzheimers-ai]
  pull_request:
    paths:
      - 'project-06-alzheimers-ai/**'
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: project-06-alzheimers-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: pytest -q
